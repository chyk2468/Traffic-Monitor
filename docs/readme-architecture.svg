<?xml version="1.0" encoding="UTF-8"?><svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="title desc"><title id="title">Traffic Monitor workflow</title><desc id="desc">An OpenCV pipeline detects and tracks vehicles, estimates speed and direction with geometric transforms, counts traffic, and renders annotations.</desc><rect width="1200" height="400" rx="18" fill="#F2F4F2"/><text x="56" y="42" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="700" letter-spacing="2.2" fill="#347D63">PROJECT MAP / WORKFLOW</text><text x="56" y="78" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="700" fill="#26332F">Traffic Monitor</text><text x="56" y="105" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#6F7B75">Video frames to vehicle analytics</text><line x1="56" y1="125" x2="1144" y2="125" stroke="#D8DFDA"/><path d="M 300 237 L 330 237" stroke="#6F7B75" stroke-width="1.8" fill="none"/><path d="M 325 232 L 330 237 L 325 242" stroke="#6F7B75" stroke-width="1.8" fill="none" stroke-linejoin="round"/><path d="M 584 237 L 614 237" stroke="#6F7B75" stroke-width="1.8" fill="none"/><path d="M 609 232 L 614 237 L 609 242" stroke="#6F7B75" stroke-width="1.8" fill="none" stroke-linejoin="round"/><path d="M 868 237 L 898 237" stroke="#6F7B75" stroke-width="1.8" fill="none"/><path d="M 893 232 L 898 237 L 893 242" stroke="#6F7B75" stroke-width="1.8" fill="none" stroke-linejoin="round"/><g><rect x="56" y="158" width="236" height="158" rx="12" fill="#FFFFFF" stroke="#D8DFDA" stroke-width="1.4"/><rect x="56" y="158" width="236" height="5" rx="2.5" fill="#347D63"/><text x="73" y="187" font-family="Arial,Helvetica,sans-serif" font-size="10.5" font-weight="700" letter-spacing="1.3" fill="#347D63">01 / VIDEO</text><text x="73" y="221" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700" fill="#26332F">Upload or configured file</text><text x="73" y="249" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#6F7B75">Read frames with OpenCV.</text></g><g><rect x="340" y="158" width="236" height="158" rx="12" fill="#FFFFFF" stroke="#D8DFDA" stroke-width="1.4"/><rect x="340" y="158" width="236" height="5" rx="2.5" fill="#B97932"/><text x="357" y="187" font-family="Arial,Helvetica,sans-serif" font-size="10.5" font-weight="700" letter-spacing="1.3" fill="#B97932">02 / DETECT + TRACK</text><text x="357" y="221" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700" fill="#26332F">Vehicle identities</text><text x="357" y="249" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#6F7B75">Detect vehicles and maintain tracks.</text></g><g><rect x="624" y="158" width="236" height="158" rx="12" fill="#FFFFFF" stroke="#D8DFDA" stroke-width="1.4"/><rect x="624" y="158" width="236" height="5" rx="2.5" fill="#5E8293"/><text x="641" y="187" font-family="Arial,Helvetica,sans-serif" font-size="10.5" font-weight="700" letter-spacing="1.3" fill="#5E8293">03 / ESTIMATE</text><text x="641" y="221" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700" fill="#26332F">Speed and direction</text><text x="641" y="249" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#6F7B75">Apply homography and motion logic.</text></g><g><rect x="908" y="158" width="236" height="158" rx="12" fill="#FFFFFF" stroke="#D8DFDA" stroke-width="1.4"/><rect x="908" y="158" width="236" height="5" rx="2.5" fill="#347D63"/><text x="925" y="187" font-family="Arial,Helvetica,sans-serif" font-size="10.5" font-weight="700" letter-spacing="1.3" fill="#347D63">04 / VISUALISE</text><text x="925" y="221" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700" fill="#26332F">Counts and annotated video</text><text x="925" y="249" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#6F7B75">Display statistics and output.</text></g><text x="56" y="358" font-family="Arial,Helvetica,sans-serif" font-size="10.5" font-weight="700" letter-spacing="1.5" fill="#347D63">IMPLEMENTATION NOTE</text><text x="56" y="380" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#6F7B75">Speed estimates depend on camera calibration, frame rate, and scene geometry.</text></svg>