<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="390" viewBox="0 0 1200 390" role="img"><rect width="1200" height="390" rx="18" fill="#F2F4F2"/><text x="56" y="42" fill="#347D63" font-family="Arial,sans-serif" font-size="11" font-weight="700" letter-spacing="2">SYSTEM FLOW / ANIMATED</text><text x="56" y="80" fill="#26332F" font-family="Arial,sans-serif" font-size="26" font-weight="700">Traffic Monitor</text><text x="56" y="108" fill="#6F7B75" font-family="Arial,sans-serif" font-size="14">Select a stage in the companion page for more details</text><line x1="56" y1="128" x2="1144" y2="128" stroke="#D8DFDA"/><path d="M 288 236 H 334" stroke="#6F7B75" stroke-width="1.8"/><path d="M 328 231 L 334 236 L 328 241" stroke="#6F7B75" fill="none"/><path d="M 576 236 H 622" stroke="#6F7B75" stroke-width="1.8"/><path d="M 616 231 L 622 236 L 616 241" stroke="#6F7B75" fill="none"/><path d="M 864 236 H 910" stroke="#6F7B75" stroke-width="1.8"/><path d="M 904 231 L 910 236 L 904 241" stroke="#6F7B75" fill="none"/><g><rect x="56" y="154" width="224" height="164" rx="12" fill="#FFFFFF" stroke="#D8DFDA"/><rect x="56" y="154" width="224" height="5" rx="2.5" fill="#347D63"/><text x="72" y="184" fill="#347D63" font-family="Arial,sans-serif" font-size="10" font-weight="700">VIDEO</text><text x="72" y="219" fill="#26332F" font-family="Arial,sans-serif" font-size="15" font-weight="700">Read frames</text><text x="72" y="248" fill="#6F7B75" font-family="Arial,sans-serif" font-size="11.5">Load frames from the source video.</text><circle cx="260" cy="179" r="4" fill="#347D63"><animate attributeName="r" values="3;5;3" dur="2s" repeatCount="indefinite"/></circle></g><g><rect x="344" y="154" width="224" height="164" rx="12" fill="#FFFFFF" stroke="#D8DFDA"/><rect x="344" y="154" width="224" height="5" rx="2.5" fill="#B97932"/><text x="360" y="184" fill="#B97932" font-family="Arial,sans-serif" font-size="10" font-weight="700">DETECT</text><text x="360" y="219" fill="#26332F" font-family="Arial,sans-serif" font-size="15" font-weight="700">Find vehicles</text><text x="360" y="248" fill="#6F7B75" font-family="Arial,sans-serif" font-size="11.5">Detect objects in each frame.</text><circle cx="548" cy="179" r="4" fill="#B97932"><animate attributeName="r" values="3;5;3" dur="2.4s" repeatCount="indefinite"/></circle></g><g><rect x="632" y="154" width="224" height="164" rx="12" fill="#FFFFFF" stroke="#D8DFDA"/><rect x="632" y="154" width="224" height="5" rx="2.5" fill="#5E8293"/><text x="648" y="184" fill="#5E8293" font-family="Arial,sans-serif" font-size="10" font-weight="700">TRACK</text><text x="648" y="219" fill="#26332F" font-family="Arial,sans-serif" font-size="15" font-weight="700">Follow objects</text><text x="648" y="248" fill="#6F7B75" font-family="Arial,sans-serif" font-size="11.5">Keep object identities across frames.</text><circle cx="836" cy="179" r="4" fill="#5E8293"><animate attributeName="r" values="3;5;3" dur="2.8s" repeatCount="indefinite"/></circle></g><g><rect x="920" y="154" width="224" height="164" rx="12" fill="#FFFFFF" stroke="#D8DFDA"/><rect x="920" y="154" width="224" height="5" rx="2.5" fill="#347D63"/><text x="936" y="184" fill="#347D63" font-family="Arial,sans-serif" font-size="10" font-weight="700">REPORT</text><text x="936" y="219" fill="#26332F" font-family="Arial,sans-serif" font-size="15" font-weight="700">Show output</text><text x="936" y="248" fill="#6F7B75" font-family="Arial,sans-serif" font-size="11.5">Display annotations and summary counts.</text><circle cx="1124" cy="179" r="4" fill="#347D63"><animate attributeName="r" values="3;5;3" dur="3.2s" repeatCount="indefinite"/></circle></g><circle r="4.5" fill="#B97932"><animateMotion dur="7s" repeatCount="indefinite" path="M 288 236 L 344 236 L 568 236 L 632 236 L 856 236 L 920 236"/></circle><circle r="3" fill="#5E8293"><animateMotion dur="7s" begin="-3.5s" repeatCount="indefinite" path="M 288 236 L 344 236 L 568 236 L 632 236 L 856 236 L 920 236"/></circle></svg>